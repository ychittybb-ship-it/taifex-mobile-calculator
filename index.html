<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>台指期近月｜即時計算</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.wrap{max-width:560px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.sub,.updated,.note{font-size:12px;color:#6b7280}.status{font-size:12px;font-weight:700}.on{color:#087f3d}.off{color:#b42318}.price{font-size:48px;font-weight:850;margin:10px 0 2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:#6b7280;display:block;margin-bottom:5px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;font-size:20px;font-weight:700}button{width:100%;padding:13px;border:0;border-radius:11px;background:#111827;color:#fff;font-size:16px;font-weight:700;margin-top:10px}table{width:100%;border-collapse:collapse}td{padding:13px 4px;border-bottom:1px solid #eef0f3}td:last-child{text-align:right;font-size:22px;font-weight:800}.hl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.hl div{padding:13px;border-radius:12px;background:#f7f8fa}.k{font-size:12px;color:#6b7280}.v{font-size:24px;font-weight:800;margin-top:4px}.log{font-size:13px;line-height:1.6;margin-top:8px}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><h1>台指期近月自動計算器</h1><div class="sub" id="symbol">TXF1!｜近月</div></div><div id="status" class="status off">● 連線中</div></div><div id="price" class="price">—</div><div id="updated" class="updated">等待即時行情</div></div><div class="card"><div class="grid"><div><label>目前波段高點 H</label><input id="hi" type="number" inputmode="decimal"></div><div><label>目前波段低點 L</label><input id="lo" type="number" inputmode="decimal"></div></div><button onclick="applyHL()">套用高低點</button><div class="hl"><div><div class="k">目前 H</div><div id="hshow" class="v">—</div></div><div><div class="k">目前 L</div><div id="lshow" class="v">—</div></div></div></div><div class="card"><table><tr><td>高低差 ÷ 3</td><td id="unit">—</td></tr><tr><td>回測 1</td><td id="r1">—</td></tr><tr><td>回測 2</td><td id="r2">—</td></tr><tr><td>反彈 1</td><td id="b1">—</td></tr><tr><td>反彈 2</td><td id="b2">—</td></tr></table></div><div class="card"><div class="note">突破 H 自動更新高點；跌破 L 自動更新低點。固定上下各 2 層。</div><div id="log" class="log">尚未發生自動更新</div></div></div><script>
let H=null,L=null;const $=id=>document.getElementById(id),fmt=x=>x==null?'—':Number(x).toLocaleString('zh-TW',{maximumFractionDigits:2});function render(){$('hshow').textContent=fmt(H);$('lshow').textContent=fmt(L);if(H==null||L==null||H<L){['unit','r1','r2','b1','b2'].forEach(x=>$(x).textContent='—');return}const u=(H-L)/3;$('unit').textContent=fmt(u);$('r1').textContent=fmt(H-u);$('r2').textContent=fmt(H-2*u);$('b1').textContent=fmt(L+u);$('b2').textContent=fmt(L+2*u)}function applyHL(){const h=parseFloat($('hi').value),l=parseFloat($('lo').value);if(!Number.isFinite(h)||!Number.isFinite(l)||h<l){alert('請輸入正確的高點與低點');return}H=h;L=l;render();$('log').textContent='已套用 H='+fmt(H)+'、L='+fmt(L)}async function poll(){try{const q=await(await fetch('/api/quote',{cache:'no-store'})).json();$('status').textContent=q.connected?'● 即時連線':'● 尚未連線';$('status').className='status '+(q.connected?'on':'off');$('symbol').textContent=(q.symbol||'TXF1!')+'｜近月';if(q.price!=null){const p=Number(q.price);$('price').textContent=fmt(p);$('updated').textContent=q.last_update?'更新：'+q.last_update:'即時行情';if(H!=null&&p>H){H=p;render();$('hi').value=H;$('log').textContent='突破原高點，自動更新 H = '+fmt(H)}else if(L!=null&&p<L){L=p;render();$('lo').value=L;$('log').textContent='跌破原低點，自動更新 L = '+fmt(L)}}}catch(e){$('status').textContent='● 連線失敗';$('status').className='status off'}}render();poll();setInterval(poll,1000);</script></body></html>
